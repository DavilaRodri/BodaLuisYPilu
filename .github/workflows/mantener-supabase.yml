# Supabase gratis pausa el proyecto si no ve actividad real en la base de datos.
# Esta tarea llama cada día a una función que hace una consulta de verdad,
# y si falla lo reintenta unos minutos antes de dar el aviso.
name: Mantener Supabase activo

on:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Consultar la base de datos
        run: |
          for i in 1 2 3 4 5; do
            if curl -fsS -X POST "https://acpcbnidfunrivrdkwlf.supabase.co/rest/v1/rpc/ping" \
              -H "apikey: sb_publishable_XLnys24am80Ih8pZnnCrRw_IVWl0dsm" \
              -H "Content-Type: application/json" -d '{}'; then exit 0; fi
            sleep 60
          done
          exit 1
