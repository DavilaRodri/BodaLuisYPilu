name: capturas
on: push
jobs:
  shot:
    if: github.ref == 'refs/heads/capturas'
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
      - run: |
          sleep 60
          npm i playwright@1.47.0 >/dev/null
          cat > s.mjs <<'JS'
          import { chromium } from 'playwright';
          const b = await chromium.launch({ channel: 'chrome' });
          for (const [w,h,n] of [[1440,900,'d'],[390,844,'m']]) {
            const p = await b.newPage({ viewport: { width: w, height: h }, colorScheme: 'light' });
            await p.goto('https://bodapilaryluis.com/?x=' + Date.now(), { waitUntil: 'networkidle' });
            await p.waitForTimeout(2500);
            await p.screenshot({ path: `live-${n}.png` });
            await p.evaluate(() => scrollTo(0, 1800)); await p.waitForTimeout(1500);
            await p.screenshot({ path: `live-${n}-2.png` });
            console.log(n, await p.evaluate(() => [...document.styleSheets].map(s => s.href).join(' ')));
          }
          await b.close();
          JS
          node s.mjs
          npx playwright install --with-deps webkit >/dev/null 2>&1
          cat > w.mjs <<'JS'
          import { webkit, devices } from 'playwright';
          const b = await webkit.launch();
          const ctx = await b.newContext({ ...devices['iPhone 13'] });
          const p = await ctx.newPage();
          await p.goto('https://bodapilaryluis.com/?x=' + Date.now(), { waitUntil: 'networkidle' });
          await p.waitForTimeout(2500);
          await p.screenshot({ path: 'live-iphone.png' });
          await p.waitForTimeout(6000);
          await p.screenshot({ path: 'live-iphone-2.png' });
          await p.locator('#busmap').scrollIntoViewIfNeeded();
          await p.locator('[data-stop=castanar]').click();
          await p.waitForTimeout(4000);
          await p.screenshot({ path: 'live-iphone-bus.png' });
          await b.close();
          JS
          node w.mjs || true
          git config user.name bot; git config user.email bot@users.noreply.github.com
          git add live-*.png && git commit -m capturas && git push origin HEAD:capturas
