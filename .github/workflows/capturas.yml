name: capturas
on: push
jobs:
  shot:
    if: github.ref == 'refs/heads/capturas'
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with: { ref: main, path: site }
      - run: |
          npm i playwright@1.47.0 >/dev/null
          npx playwright install --with-deps webkit >/dev/null 2>&1
          (cd site && python3 -m http.server 8000 >/dev/null 2>&1 &)
          sleep 2
          cat > w.mjs <<'JS'
          import { webkit, devices } from 'playwright';
          const V = {
            a: '',
            b: '.hero__media img.is-on.drift{animation:none!important}',
            c: '.hero__media.napkin{filter:none!important}',
            d: '.hero__media .napkin__photo{isolation:isolate;transform:translateZ(0)}',
            e: '.hero__media.rise{opacity:1!important;transform:none!important;transition:none!important}',
            f: '.hero__media .napkin__photo{max-height:none!important;min-height:0!important}',
            g: '.hero__media img{transition:none!important}.hero__media img.is-on.drift{animation:none!important}.hero__media.rise{transform:none!important;transition:none!important}'
          };
          const b = await webkit.launch();
          for (const k in V) {
            const ctx = await b.newContext({ ...devices['iPhone 13'] });
            const p = await ctx.newPage();
            await p.goto('http://localhost:8000/', { waitUntil: 'networkidle' });
            if (V[k]) await p.addStyleTag({ content: V[k] });
            await p.waitForTimeout(3000);
            await p.screenshot({ path: `t-${k}.png`, clip: { x: 0, y: 180, width: 390, height: 480 } });
            await ctx.close();
          }
          await b.close();
          JS
          node w.mjs
          git config user.name bot; git config user.email bot@users.noreply.github.com
          git add t-*.png && git commit -m pruebas && git push origin HEAD:capturas
