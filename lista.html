<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Quién viene · Pilar &amp; Luis</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='16' fill='%234f5d3f'/%3E%3Ctext x='16' y='21' font-family='Georgia' font-size='13' fill='%23fff' text-anchor='middle'%3EP%26amp;L%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,400&family=Jost:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/estilo.css">
  <script>(function(){var t=null;try{t=localStorage.getItem('tema')}catch(e){}if(!t)t=matchMedia('(prefers-color-scheme: light)').matches?'light':'dark';document.documentElement.dataset.theme=t})();</script>
  <style>
    [hidden] { display: none !important; }
    .wrap { padding: clamp(32px, 5vw, 64px) 0 80px; }
    .btn { padding: 6px 26px; }
    .wrap h1 { font-size: var(--fs-h2); }
    .totals { display: flex; flex-wrap: wrap; gap: 24px 56px; margin: 40px 0; list-style: none; padding: 0; }
    .totals strong { display: block; font-weight: 400; font-size: var(--fs-h2); line-height: 1; color: var(--accent); font-variant-numeric: lining-nums; }
    .tools { display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 24px; }
    .sheet { background: var(--card); overflow-x: auto; }
    .sheet { border-radius: 22px; }
    table { width: 100%; border-collapse: collapse; font-size: var(--fs-body); }
    th, td { text-align: left; padding: 14px 16px; border-bottom: 1px solid var(--line); /* taste-skill-ignore: tabla */ vertical-align: top; }
    th { font-weight: 500; }
    td.si { color: var(--accent); }
    td.no { color: var(--error); }
    td ul { margin: 0; padding-left: 1.1em; }
    .state { padding: 24px 0; }
    .login { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 24px; max-width: 520px; }
    .login .field { flex: 1 1 220px; }
    .btn--ghost { background: var(--shell); color: var(--ink); }
    .btn--ghost:hover { background: var(--ink); color: var(--bg); }
  </style>
</head>
<body>
  <main class="wrap">
    <h1>Quién viene</h1>

    <form class="login" id="login" hidden>
      <input class="field" id="clave" type="password" placeholder="Clave de la lista" autocomplete="current-password" aria-label="Clave de la lista">
      <button class="btn" type="submit">Ver lista</button>
    </form>

    <ul class="totals" id="totals" hidden>
      <li><strong id="n-personas">0</strong>personas vienen</li>
      <li><strong id="n-si">0</strong>confirmaciones de sí</li>
      <li><strong id="n-no">0</strong>no podrán ir</li>
    </ul>

    <div class="tools" id="tools" hidden>
      <button class="btn" type="button" id="csv">Descargar para Excel</button>
      <button class="btn btn--ghost" type="button" id="reload">Actualizar</button>
    </div>

    <p class="state" id="state" role="status">Cargando…</p>
    <div class="sheet" id="sheet" hidden>
      <table>
        <thead><tr><th>Fecha</th><th>¿Viene?</th><th>Personas</th><th>Comentario</th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
  </main>

  <script src="js/config.js"></script>
  <script>
  (function () {
    const cfg = window.BODA;
    const $ = id => document.getElementById(id);
    let data = [];

    function key() {
      return decodeURIComponent(location.hash.slice(1)) || localStorageGet();
    }
    function localStorageGet() { try { return localStorage.getItem('boda-clave') || ''; } catch (e) { return ''; } }
    function localStorageSet(v) { try { localStorage.setItem('boda-clave', v); } catch (e) {} }

    async function load() {
      const k = key();
      if (!k) { $('state').textContent = 'Escribe la clave para ver la lista.'; $('login').hidden = false; return; }
      $('state').textContent = 'Cargando…';
      try {
        const res = await fetch(cfg.supabaseUrl + '/rest/v1/rpc/lista_confirmaciones', {
          method: 'POST',
          headers: { apikey: cfg.supabaseKey, 'Content-Type': 'application/json' },
          body: JSON.stringify({ clave: k })
        });
        if (!res.ok) throw new Error(res.status);
        data = await res.json();
        localStorageSet(k);
        render();
      } catch (e) {
        $('state').textContent = 'La clave no es correcta o no hay conexión.';
        $('login').hidden = false;
      }
    }

    function esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
    function fecha(s) { return new Date(s).toLocaleString('es-ES', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }); }

    function render() {
      $('login').hidden = true;
      const si = data.filter(r => r.asistira);
      $('n-personas').textContent = si.reduce((n, r) => n + r.nombres.length, 0);
      $('n-si').textContent = si.length;
      $('n-no').textContent = data.length - si.length;
      $('totals').hidden = $('tools').hidden = false;
      if (!data.length) { $('state').textContent = 'Todavía no ha confirmado nadie.'; $('sheet').hidden = true; return; }
      $('state').textContent = '';
      $('sheet').hidden = false;
      $('rows').innerHTML = data.map(r =>
        '<tr><td>' + esc(fecha(r.creado)) + '</td>' +
        '<td class="' + (r.asistira ? 'si">Sí' : 'no">No') + '</td>' +
        '<td><ul>' + r.nombres.map(n => '<li>' + esc(n) + '</li>').join('') + '</ul></td>' +
        '<td>' + esc(r.comentario) + '</td></tr>').join('');
    }

    $('csv').addEventListener('click', () => {
      const q = v => '"' + String(v ?? '').replace(/"/g, '""') + '"';
      const lines = [['Fecha', 'Viene', 'Nombre', 'Comentario'].map(q).join(';')];
      data.forEach(r => r.nombres.forEach(n =>
        lines.push([new Date(r.creado).toLocaleString('es-ES'), r.asistira ? 'Sí' : 'No', n, r.comentario].map(q).join(';'))));
      const blob = new Blob(['﻿' + lines.join('\r\n')], { type: 'text/csv;charset=utf-8' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'invitados-boda-pilar-luis.csv';
      a.click();
      URL.revokeObjectURL(a.href);
    });
    $('reload').addEventListener('click', load);
    $('login').addEventListener('submit', e => {
      e.preventDefault();
      location.hash = encodeURIComponent($('clave').value.trim());
    });
    window.addEventListener('hashchange', load);
    load();
  })();
  </script>
</body>
</html>
